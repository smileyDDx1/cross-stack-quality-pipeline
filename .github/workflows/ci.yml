name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run unit tests
        run: >
          dotnet test api/TaskTracker.UnitTests
          --logger "trx;LogFileName=unit.trx"
          --logger "console;verbosity=normal"
          --results-directory test-results

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: test-results

  integration:
    name: API, E2E and load tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A unique Compose project per run and attempt: its own containers, network and (tmpfs) database.
      COMPOSE_PROJECT_NAME: tt-${{ github.run_id }}-${{ github.run_attempt }}
      API_BASE_URL: http://localhost:8080
      RUN_ID: gh${{ github.run_id }}a${{ github.run_attempt }}
      JWT_KEY: ci-signing-key-${{ github.run_id }}-${{ github.run_attempt }}-not-a-secret-0123456789
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v4

      - name: Start API and database
        id: stack
        working-directory: .
        run: docker compose up --build --detach --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/requirements.txt

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: API tests
        run: >
          pytest tests/api -n auto
          --junitxml=reports/api-junit.xml
          --html=reports/api-report.html --self-contained-html

      - name: E2E tests
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: >
          pytest tests/e2e -n 2
          --junitxml=reports/e2e-junit.xml
          --html=reports/e2e-report.html --self-contained-html
          --tracing retain-on-failure --screenshot only-on-failure
          --output reports/playwright

      - name: Load test (smoke profile with SLO gate)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        env:
          LOAD_MAX_P95_MS: "500"
          LOAD_MAX_FAIL_RATIO: "0.01"
        run: |
          mkdir -p reports
          set +e
          locust -f load/locustfile.py --host "$API_BASE_URL" --headless \
            --users 25 --spawn-rate 5 --run-time 60s --only-summary \
            --csv reports/load --html reports/load-report.html
          status=$?
          set -e
          python load/summary.py reports/load_stats.csv >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Capture service logs
        if: ${{ failure() }}
        working-directory: .
        run: |
          mkdir -p qa/reports
          docker compose logs --no-color --timestamps > qa/reports/compose.log

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: qa/reports
          if-no-files-found: ignore

      - name: Tear down
        if: ${{ always() }}
        working-directory: .
        run: docker compose down --volumes --remove-orphans
